<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f9;
    padding:40px;
}

/* TÍTULO */
h1{
    text-align:center;
    margin-bottom:10px;
    color:#000;
}

.subtitulo{
    text-align:center;
    color:#666;
    margin-bottom:40px;
}

/* CATEGORIAS */
.categoria{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    margin-bottom:30px;
}

.categoria h2{
    margin-top:0;
    color:#8e44ad;
    margin-bottom:20px;
}

/* LINKS DOS ARQUIVOS */
.arquivos{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.arquivos a{
    background:#8e44ad;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:20px;
    font-weight:bold;
    transition:0.3s;
    display:inline-block;
}

.arquivos a:hover{
    background:#6a1b9a;
    transform:scale(1.05);
}

/* BOTÃO VOLTAR */
.voltar{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#8e44ad;
    color:white;
    text-decoration:none;
    border-radius:20px;
    transition:0.3s;
}

.voltar:hover{
    background:#6a1b9a;
}

</style>

</head>
